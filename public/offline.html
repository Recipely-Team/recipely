<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Recipely</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #111318;
        --muted: #6b7280;
        --brand: #ee8941;
        --on-brand: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --text: #e7e8eb;
          --muted: #9ea0a8;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.4px;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
      }
      button {
        margin-top: 24px;
        min-height: 48px;
        width: 100%;
        padding: 0 20px;
        border: none;
        border-radius: 14px;
        background: var(--brand);
        color: var(--on-brand);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      /* The reload button appears only once there is a connection to reload
         over — offering it while offline promises something it cannot do. */
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

      <h1 id="title"></h1>
      <p id="body"></p>
      <button id="reload" type="button" hidden></button>
    </main>
    <script>
      (function () {
        // The app's own i18n lives in the bundle this page exists because we
        // could not load, so the two languages the app is actually used in are
        // inlined. Everything else falls back to English.
        var COPY = {
          en: {
            offlineTitle: "You're offline",
            offlineBody: 'Recipely needs a connection to load recipes. Reconnect and this page will offer a way back.',
            onlineTitle: "You're back online",
            onlineBody: 'The connection has returned — pick up where you left off.',
            reload: 'Reload Recipely',
          },
          tr: {
            offlineTitle: 'İnternet bağlantısı yok',
            offlineBody: 'Tarifleri yükleyebilmek için bağlantı gerekiyor. Bağlandığında bu sayfa geri dönüş yolunu sunacak.',
            onlineTitle: 'Bağlantı geri geldi',
            onlineBody: 'Kaldığın yerden devam edebilirsin.',
            reload: "Recipely'yi yeniden yükle",
          },
        };
        var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
        var t = COPY[lang] || COPY.en;
        document.documentElement.lang = COPY[lang] ? lang : 'en';

        var title = document.getElementById('title');
        var body = document.getElementById('body');
        var reload = document.getElementById('reload');
        reload.textContent = t.reload;
        reload.addEventListener('click', function () {
          location.replace('/');
        });

        function sync() {
          var online = navigator.onLine;
          title.textContent = online ? t.onlineTitle : t.offlineTitle;
          body.textContent = online ? t.onlineBody : t.offlineBody;
          reload.hidden = !online;
        }
        window.addEventListener('online', sync);
        window.addEventListener('offline', sync);
        sync();
      })();
    </script>
